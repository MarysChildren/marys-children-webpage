<!DOCTYPE html>
<html lang="es">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    .card { max-width: 340px; }
    .escudo { width: 130px; height: auto; margin-bottom: 18px; }

    .sub { font-size: 15px; color: #444; margin: 0 0 28px; }
    .btn {
      display: block;
      background: #00811F;
      color: #fff;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,129,31,0.28);
    }
    .btn:active { background: #006E1A; }
    .tip {
      margin-top: 22px;
      font-size: 12.5px;
      color: #888;
      line-height: 1.5;

<body>
